<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f1">
  <title>Kiwi Natural | Comida natural en Culiacán</title>
  <meta name="description" content="Kiwi Natural. Restaurante, sandwichería y comida natural en Culiacán.">
  <script>
    (() => {
      const mobileHint = navigator.userAgentData?.mobile;
      const phoneAgent = /iPhone|iPod|Windows Phone|BlackBerry|Opera Mini|Android.+Mobile/i;
      const isPhone = typeof mobileHint === "boolean" ? mobileHint : phoneAgent.test(navigator.userAgent);
      if (isPhone) window.location.replace("/menu/");
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2307130e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23b9df53'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2307130e'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="/landing-assets/assets/kiwi-hero-crate.jpg">
  <link rel="stylesheet" href="/landing-assets/styles.css">
</head>
<body>
  <main id="inicio" class="kiwi-desktop-hero" aria-label="Acceso principal de Kiwi Natural">
    <figure class="kiwi-desktop-hero__media">
      <img
        class="kiwi-desktop-hero__image"
        src="/landing-assets/assets/kiwi-hero-crate.jpg"
        width="1376"
        height="768"
        fetchpriority="high"
        alt="Canasta azul con frutas y verduras frescas de Kiwi Natural">
    </figure>
    <div class="kiwi-desktop-hero__actions">
      <a class="kiwi-enter-cta" href="/admin/">ENTRAR</a>
    </div>
  </main>

  <script src="/landing-assets/app.js"></script>
</body>
</html>
