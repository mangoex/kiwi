# SEC001-SYNTHETIC-FIXTURE provenance=restaurantos-ci-test-services-v1
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject newly introduced high-severity vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check pull request diff whitespace
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --check "origin/$BASE_REF...HEAD"
      - name: Enforce repository policy
        run: python scripts/repository_policy.py .
      - name: Reject newly added quality suppressions
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/quality_ratchet.py --base "origin/$BASE_REF" --head HEAD

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pco005b_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d pco005b_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: |
          python scripts/install_python_runtime.py --dev
      - name: Create isolated PCO, SEC, catalog and integration PostgreSQL databases
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'pco005b_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE pco005b_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'pco006_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE pco006_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'pco007_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE pco007_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'pco008_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE pco008_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'sec001_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE sec001_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'mobord001_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE mobord001_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'aia001_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE aia001_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'rbac0056_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE rbac0056_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'seed0058_ci'" | grep -qx 1 || psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE seed0058_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE adminretro_test_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE combo_test_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE compound_products_test_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE offline_orders_test_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE pco004_offline_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE catclass_test_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE sr_workspace_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE pos_cashier_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE physical_count_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE admin_unification_test_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE exp001_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE exp001_migration_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE pco003_ci"
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE audcore_ci"
      - name: Preprovision mandatory PCO-003 PostgreSQL schema
        working-directory: apps/api
        env:
          PCO003_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pco003_ci
        run: RESTAURANTOS_DATABASE_URL="$PCO003_TEST_POSTGRES_URL" python -m alembic -c alembic.ini upgrade head
      - name: Preprovision MOB-ORD-001 PostgreSQL at revision 0050
        working-directory: apps/api
        env:
          MOBORD001_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mobord001_ci
        run: RESTAURANTOS_DATABASE_URL="$MOBORD001_TEST_POSTGRES_URL" python -m alembic -c alembic.ini upgrade 0050_promote_recipes_to_global_scope
      - name: Run tests
        env:
          PCO003_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pco003_ci
          AUDCORE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/audcore_ci
          EXP001_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/exp001_ci
          EXP001_TEST_POSTGRES_MIGRATION_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/exp001_migration_ci
          PCO005B_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pco005b_ci
          PCO006_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pco006_ci
          PCO007_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pco007_ci
          PCO008_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pco008_ci
          SEC001_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sec001_ci
          MOBORD001_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mobord001_ci
          AIA001_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/aia001_ci
          RBAC0056_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/rbac0056_ci
          SEED0058_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seed0058_ci
          ADMINRETRO_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/adminretro_test_ci
          COMBOS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/combo_test_ci
          COMPOUND_PRODUCTS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/compound_products_test_ci
          OFFLINE_ORDERS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/offline_orders_test_ci
          SR_WORKSPACE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sr_workspace_ci
          POS_CASHIER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pos_cashier_ci
          PHYSICAL_COUNT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/physical_count_ci
          ADMIN_UNIFICATION_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/admin_unification_test_ci
          CATCLASS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/catclass_test_ci
          PCO004_TEST_POSTGRES_ROUNDTRIP_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/pco004_offline_ci
        run: |
          python -m pytest --collect-only -q > python-collection.txt
          python -m pytest --junitxml=python-tests.xml
      - name: Require executed PostgreSQL evidence for financial suites
        if: always()
        run: python scripts/verify_postgres_evidence.py --collection python-collection.txt --junit python-tests.xml
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-evidence
          path: |
            python-collection.txt
            python-tests.xml
      - name: Strict backend typecheck
        run: python -m mypy apps/api/restaurant_os
      - name: Ruff
        run: python -m ruff check apps/api tests
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f infra/docker/docker-compose.yml config
      - name: Build both API images from frozen inputs
        run: |
          docker build -f Dockerfile -t restaurantos-audcore-root:ci .
          docker build -f infra/docker/api.Dockerfile -t restaurantos-audcore-api:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Run semantic frontend regressions
        run: pnpm test:frontend-semantic
      - name: Build Admin
        run: pnpm --filter @restaurantos/admin-web build
      - name: Install isolated browser verification runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/adminretro-browser" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/adminretro-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify Admin retro in browser
        env:
          ADMINRETRO_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
          ADMINRETRO_BASE_URL: http://127.0.0.1:3002/admin
        run: |
          pnpm --filter @restaurantos/admin-web exec vite preview --host 127.0.0.1 --port 3002 > "$RUNNER_TEMP/adminretro-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/admin/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3002/admin/ > /dev/null
          node tests/browser/test_admin_retro.mjs
          node tests/browser/test_recipe_product_flow.mjs
          node tests/browser/test_compound_product_admin.mjs
          node tests/browser/test_shared_modifier_workspace.mjs
          node tests/browser/test_admin_session_recovery.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build POS
        run: pnpm --filter @restaurantos/pos-web build
      - name: Install API for browser integration
        run: python scripts/install_python_runtime.py --dev
      - name: Verify Admin against isolated API
        env:
          ADMINRETRO_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
          ADMINRETRO_E2E_MANIFEST: ${{ runner.temp }}/adminretro-e2e/manifest.json
          RESTAURANTOS_ENVIRONMENT: test
          RESTAURANTOS_DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/adminretro-e2e/database.sqlite
          RESTAURANTOS_SECRET_KEY: admin-retro-e2e-local-only-secret-key
          STATIC_DIR: ${{ runner.temp }}/adminretro-e2e/static
          SR_WORKSPACE_E2E_MANIFEST: ${{ runner.temp }}/adminretro-e2e/manifest.json
          SR_WORKSPACE_BASE_URL: http://127.0.0.1:8002
        run: |
          python tests/e2e/admin_retro_fixture.py --database "$RUNNER_TEMP/adminretro-e2e/database.sqlite" --manifest "$ADMINRETRO_E2E_MANIFEST"
          mkdir -p "$STATIC_DIR/admin-web"
          cp -R apps/admin-web/dist/. "$STATIC_DIR/admin-web/"
          mkdir -p "$STATIC_DIR/pos-web"
          cp -R apps/pos-web/dist/. "$STATIC_DIR/pos-web/"
          python -m uvicorn restaurant_os.main:app --host 127.0.0.1 --port 8002 --app-dir apps/api > "$RUNNER_TEMP/adminretro-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/admin/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8002/admin/ > /dev/null
          node tests/browser/test_admin_retro_e2e.mjs
          node tests/browser/test_purchase_workspace_e2e.mjs
          ADMINRETRO_BASE_URL=http://127.0.0.1:8002/admin ADMIN_SESSION_REAL_MANIFEST="$ADMINRETRO_E2E_MANIFEST" node tests/browser/test_admin_session_recovery.mjs
      - name: Verify reconciliation v2 against isolated API
        env:
          ADMINRETRO_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
          RECONCILIATION_E2E_MANIFEST: ${{ runner.temp }}/adminretro-e2e/reconciliation-manifest.json
          RECONCILIATION_BASE_URL: http://127.0.0.1:8127
          RESTAURANTOS_ENVIRONMENT: test
          RESTAURANTOS_SECRET_KEY: admin-retro-e2e-local-only-secret-key
          STATIC_DIR: ${{ runner.temp }}/adminretro-e2e/static
        run: |
          python tests/browser/seed_reconciliation_fixture.py --manifest "$RUNNER_TEMP/adminretro-e2e/manifest.json"
          export RESTAURANTOS_DATABASE_URL="sqlite+pysqlite:///$RUNNER_TEMP/adminretro-e2e/reconciliation.sqlite"
          python -m uvicorn restaurant_os.main:app --host 127.0.0.1 --port 8127 --app-dir apps/api > "$RUNNER_TEMP/reconciliation-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8127/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8127/health/live > /dev/null
          node tests/browser/test_reconciliation_e2e.mjs
      - name: Verify operating expenses against isolated API
        env:
          ADMINRETRO_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
          EXP001_E2E_MANIFEST: ${{ runner.temp }}/exp001-e2e/manifest.json
          EXP001_BASE_URL: http://127.0.0.1:8148
          RESTAURANTOS_ENVIRONMENT: test
          RESTAURANTOS_DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/exp001-e2e/database.sqlite
          RESTAURANTOS_SECRET_KEY: admin-retro-e2e-local-only-secret-key
          STATIC_DIR: ${{ runner.temp }}/exp001-e2e/static
        run: |
          python tests/e2e/expense_fixture.py --database "$RUNNER_TEMP/exp001-e2e/database.sqlite" --manifest "$EXP001_E2E_MANIFEST"
          mkdir -p "$STATIC_DIR/admin-web" "$STATIC_DIR/pos-web"
          cp -R apps/admin-web/dist/. "$STATIC_DIR/admin-web/"
          cp -R apps/pos-web/dist/. "$STATIC_DIR/pos-web/"
          python -m uvicorn restaurant_os.main:app --host 127.0.0.1 --port 8148 --app-dir apps/api > "$RUNNER_TEMP/exp001-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8148/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8148/health/live > /dev/null
          node tests/browser/test_operating_expenses_e2e.mjs
      - name: Build KDS
        run: pnpm --filter @restaurantos/kds-web build
      - name: Verify offline POS and KDS against isolated gateway
        env:
          OFFLINE_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
        run: node tests/browser/test_offline_gateway_real.mjs
      - name: Build Mobile Web
        run: pnpm --filter @restaurantos/mobile-web build
      - name: Build Public Landing
        run: pnpm --filter @restaurantos/landing-web build

      - name: Verify catalog, assistant and offline browser regressions
        env:
          ADMINRETRO_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
          AIA002_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
          OFFLINE_PLAYWRIGHT_IMPORT: file://${{ runner.temp }}/adminretro-browser/node_modules/playwright/index.mjs
          ADMINRETRO_BASE_URL: http://127.0.0.1:3002/admin
          AIA002_BASE_URL: http://127.0.0.1:3002/admin/products
          AIA002_OUTPUT_DIR: ${{ runner.temp }}/assistant-browser
          CATCLASS_POS_URL: http://127.0.0.1:4175/pos
        run: |
          pnpm --filter @restaurantos/admin-web exec vite preview --host 127.0.0.1 --port 3002 > "$RUNNER_TEMP/admin-preview.log" 2>&1 &
          admin_pid=$!
          pnpm --filter @restaurantos/pos-web exec vite preview --host 127.0.0.1 --port 4175 > "$RUNNER_TEMP/pos-preview.log" 2>&1 &
          pos_pid=$!
          pnpm --filter @restaurantos/kds-web exec vite preview --host 127.0.0.1 --port 4176 > "$RUNNER_TEMP/kds-preview.log" 2>&1 &
          kds_pid=$!
          trap 'kill "$admin_pid" "$pos_pid" "$kds_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:3002/admin/ http://127.0.0.1:4175/pos/ http://127.0.0.1:4176/kds/; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done
          node tests/browser/test_catalog_classification.mjs
          node tests/browser/test_admin_ai_assistant.mjs
          node tests/browser/test_offline_shell_real.mjs
