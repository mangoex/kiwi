    CorporateScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          const: corporate
    BranchScope:
      type: object
      additionalProperties: false
      required: [kind, branch_id]
      properties:
        kind:
          type: string
          const: branch
        branch_id:
          $ref: "#/components/schemas/Uuid"
    Scope:
      oneOf:
        - $ref: "#/components/schemas/CorporateScope"
        - $ref: "#/components/schemas/BranchScope"
    CatalogProposalCommand:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [action]
            properties:
              action:
                const: product.create
          then:
            properties:
              target_id:
                type: "null"
              expected_version:
                type: "null"
              fields:
                required: [name, sku, category_name, station, price_cents]
                not:
                  required: [status]
          else:
            required: [target_id, expected_version]
            properties:
              target_id:
                $ref: "#/components/schemas/Uuid"
              expected_version:
                type: integer
                minimum: 1
      required: [scope, action, fields]
      properties:
        scope:
          $ref: "#/components/schemas/CorporateScope"
        action:
          type: string
          enum: [product.create, product.update]
        target_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        expected_version:
          type: [integer, "null"]
          minimum: 1
        fields:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            sku:
              type: string
              minLength: 1
              maxLength: 64
            name:
              type: string
              minLength: 1
              maxLength: 160
            category_name:
              type: string
              minLength: 1
              maxLength: 120
            station:
              type: string
              enum: [kitchen, drinks, packing]
            price_cents:
              type: integer
              minimum: 1
              maximum: 2147483647
            image_url:
              type: string
              format: uri
              maxLength: 512
            status:
              type: string
              enum: [active, inactive]
    InventoryItemProposalCommand:
      type: object
      additionalProperties: false
      required: [scope, sku, name, base_unit_id]
      properties:
        scope:
          $ref: "#/components/schemas/CorporateScope"
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 160
        base_unit_id:
