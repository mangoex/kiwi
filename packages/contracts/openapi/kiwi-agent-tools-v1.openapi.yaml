          type: string
          enum: [catalog_proposal, inventory_item_proposal, recipe_proposal, purchase_draft]
        status:
          $ref: "#/components/schemas/OperationStatus"
        resource_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/AgentReasonCode"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CallbackEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - occurred_at
        - operation_id
        - operation_type
        - status
      properties:
        event_id:
          $ref: "#/components/schemas/Uuid"
        event_type:
          type: string
          const: agent.operation.status_changed
        occurred_at:
          type: string
          format: date-time
        operation_id:
          $ref: "#/components/schemas/Uuid"
        operation_type:
          type: string
          enum: [catalog_proposal, inventory_item_proposal, recipe_proposal, purchase_draft]
        status:
          $ref: "#/components/schemas/OperationStatus"
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/AgentReasonCode"
            - type: "null"
    BusinessError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          $ref: "#/components/schemas/BusinessErrorDetail"
    BusinessErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
          enum:
            - permission_denied
            - agent_unauthorized
            - agent_disabled
            - agent_capability_denied
            - agent_branch_denied
            - agent_identity_not_found
            - agent_integration_not_configured
            - agent_schema_invalid
            - callback_destination_denied
            - idempotency_conflict
            - stale_reference
            - rate_limited
            - dependency_unavailable
            - operation_not_found
        message:
          type: string
          maxLength: 300
        correlation_id:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: "null"
