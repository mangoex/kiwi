        yield_unit_id:
          $ref: "#/components/schemas/Uuid"
        components:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/RecipeComponent"
    PurchaseDraftLine:
      type: object
      additionalProperties: false
      required: [presentation_id, quantity, unit_price, discount, tax]
      properties:
        presentation_id:
          $ref: "#/components/schemas/Uuid"
        quantity:
          $ref: "#/components/schemas/PositiveDecimalString"
        unit_price:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        discount:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        tax:
          $ref: "#/components/schemas/NonNegativeDecimalString"
    PurchaseDraftCommand:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              payment_method:
                const: cash
          then:
            properties:
              paid_from_cash:
                const: true
          else:
            properties:
              paid_from_cash:
                const: false
      required:
        - branch_id
        - supplier_id
        - document_type
        - folio
        - document_date
        - payment_method
        - paid_from_cash
        - lines
      properties:
        branch_id:
          $ref: "#/components/schemas/Uuid"
        supplier_id:
          $ref: "#/components/schemas/Uuid"
        document_type:
          type: string
          enum: [invoice, receipt, ticket, note]
        folio:
          type: string
          minLength: 1
          maxLength: 80
        document_date:
          type: string
          format: date
        payment_method:
          type: string
          enum: [cash, transfer, card, other]
        paid_from_cash:
          type: boolean
        freight_total:
          type: string
          const: "0"
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/PurchaseDraftLine"
    OperationStatus:
      type: string
      enum:
        - RECEIVED
        - VALIDATED
        - READY_FOR_REVIEW
        - DRAFT_CREATED
        - REJECTED
        - APPLIED
        - EXPIRED
        - CONFIRMED_BY_HUMAN
        - CANCELLED_BY_HUMAN
    AgentReasonCode:
      type: string
      enum:
        - validation_rejected
        - stale_reference
        - human_rejected
        - expired
        - canonical_apply_failed
        - canonical_confirmed
        - canonical_cancelled
        - callback_destination_denied
        - callback_delivery_exhausted
    AgentOperation:
      type: object
