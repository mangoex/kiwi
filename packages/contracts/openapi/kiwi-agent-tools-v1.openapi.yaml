openapi: 3.1.0
info:
  title: Kiwi Agent Tools API
  version: 1.0.0-rc.1
  description: >-
    Contrato versionado para agentes externos. Las escrituras crean propuestas o borradores;
    nunca confirman compras ni aplican movimientos de inventario.
servers:
  - url: https://{kiwiHost}
    variables:
      kiwiHost:
        default: kiwi.example.invalid
security:
  - serviceBearer: []
tags:
  - name: Agent authentication
  - name: Agent context
  - name: Agent reads
  - name: Agent proposals
  - name: Agent purchase drafts
  - name: Agent operations
paths:
  /api/v1/agent-auth/token:
    post:
      tags: [Agent authentication]
      operationId: issueAgentAccessToken
      summary: Emitir token de servicio de vida corta
      security:
        - clientCredentials: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/context:
    get:
      tags: [Agent context]
      operationId: getAgentContext
      summary: Consultar identidad, capacidades y sucursales efectivas
      responses:
        "200":
          description: Contexto efectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/catalog/items:
    get:
      tags: [Agent reads]
      operationId: listAgentCatalogItems
      summary: Listar catálogo administrativo minimizado
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/sales/summary:
    get:
      tags: [Agent reads]
      operationId: getAgentSalesSummary
      summary: Consultar ventas confirmadas agregadas de una sucursal
      description: >-
        Agrega snapshots inmutables; no devuelve folios, pedidos, pagos, cajas, clientes o personal.
        Las correcciones posteriores se presentan separadas de la venta original.
      parameters:
        - $ref: "#/components/parameters/RequiredBranchId"
        - name: from_utc
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to_utc
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: top_limit
          in: query
          required: false
          description: Número máximo de productos devueltos por moneda.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Resumen minimizado de ventas confirmadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/inventory/items:
    get:
      tags: [Agent reads]
      operationId: listAgentInventoryItems
      summary: Listar insumos minimizados
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de insumos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/inventory/stock:
    get:
      tags: [Agent reads]
      operationId: listAgentInventoryStock
      summary: Listar existencia resumida de una sucursal
      parameters:
        - $ref: "#/components/parameters/RequiredBranchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de existencia resumida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/recipes:
    get:
      tags: [Agent reads]
      operationId: listAgentRecipes
      summary: Listar recetas efectivas
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de recetas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/suppliers:
    get:
      tags: [Agent reads]
      operationId: listAgentSuppliers
      summary: Listar proveedores habilitados para compra
      parameters:
        - $ref: "#/components/parameters/RequiredBranchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de proveedores sin contactos personales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/purchase-needs:
    get:
      tags: [Agent reads]
      operationId: listAgentPurchaseNeeds
      summary: Listar necesidades de compra calculadas por Kiwi
      parameters:
        - $ref: "#/components/parameters/RequiredBranchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de necesidades sugeridas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseNeedPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/proposals/catalog:
    post:
      tags: [Agent proposals]
      operationId: createAgentCatalogProposal
      summary: Crear propuesta revisable de catálogo
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogProposalCommand"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/proposals/inventory-items:
    post:
      tags: [Agent proposals]
      operationId: createAgentInventoryItemProposal
      summary: Crear propuesta revisable de alta de insumo
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemProposalCommand"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/proposals/recipes:
    post:
      tags: [Agent proposals]
      operationId: createAgentRecipeProposal
      summary: Crear propuesta revisable de nueva versión de receta
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeProposalCommand"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/purchase-drafts:
    post:
      tags: [Agent purchase drafts]
      operationId: createAgentPurchaseDraft
      summary: Crear compra en estado DRAFT sin efectos de inventario o caja
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseDraftCommand"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/agent-tools/operations/{operation_id}:
    get:
      tags: [Agent operations]
      operationId: getAgentOperation
      summary: Recuperar estado autoritativo de una operación propia
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Estado autoritativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOperation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
components:
  securitySchemes:
    clientCredentials:
      type: http
      scheme: basic
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    RequiredBranchId:
      name: branch_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BranchId:
      name: branch_id
      in: query
      required: false
      description: Obligatorio salvo que la capacidad autorice explícitamente alcance corporativo.
      schema:
        $ref: "#/components/schemas/Uuid"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 180
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
  responses:
    OperationAccepted:
      description: Propuesta o borrador persistido para revisión
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentOperation"
    InvalidRequest:
      description: Esquema o referencia inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
    PayloadTooLarge:
      description: El body excede el límite de 64 KiB de Agent Tools
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
    Unauthorized:
      description: Credencial ausente, inválida o vencida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
    Forbidden:
      description: Integración, capacidad o sucursal no autorizada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
    NotFound:
      description: Operación no encontrada dentro de la identidad autorizada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
    Conflict:
      description: Idempotencia, versión o referencia en conflicto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
    RateLimited:
      description: Límite acotado excedido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
    DependencyUnavailable:
      description: Dependencia temporalmente no disponible; no implica éxito
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessError"
  schemas:
    Uuid:
      type: string
      format: uuid
    DecimalString:
      type: string
      maxLength: 20
      pattern: "^-?(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,6})?$"
    NonNegativeDecimalString:
      type: string
      maxLength: 19
      pattern: "^(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,6})?$"
    PositiveDecimalString:
      type: string
      maxLength: 19
      pattern: "^(?=.*[1-9])(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,6})?$"
    WasteRateString:
      type: string
      maxLength: 8
      pattern: "^0(?:\\.[0-9]{1,6})?$"
    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          minLength: 32
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 30
          maximum: 600
    AgentProfile:
      type: string
      enum: [administrator, kitchen, inventory, purchasing]
    BranchSummary:
      type: object
      additionalProperties: false
      required: [id, code, name, timezone]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 160
        timezone:
          type: string
          minLength: 1
          maxLength: 80
          description: Zona IANA usada para convertir fechas locales a UTC.
    AgentContext:
      type: object
      additionalProperties: false
      required:
        [identity_id, profile, authorization_version, capabilities, corporate_scope, branches]
      properties:
        identity_id:
          $ref: "#/components/schemas/Uuid"
        profile:
          $ref: "#/components/schemas/AgentProfile"
        authorization_version:
          type: integer
          minimum: 1
        capabilities:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            enum:
              - agent.context.read
              - agent.catalog.read
              - agent.sales.read
              - agent.inventory.read
              - agent.recipes.read
              - agent.suppliers.read
              - agent.purchase_needs.read
              - agent.catalog.propose
              - agent.inventory_item.propose
              - agent.recipe.propose
              - agent.purchase_draft.create
        corporate_scope:
          type: boolean
        branches:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/BranchSummary"
    PageMeta:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          maxLength: 512
        has_more:
          type: boolean
    CatalogItem:
      type: object
      additionalProperties: false
      required:
        [id, sku, name, category_name, station, price_cents, currency, available, sellable, active, version]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 160
        category_name:
          type: string
          minLength: 1
          maxLength: 120
        station:
          type: string
          minLength: 1
          maxLength: 32
        price_cents:
          type: [integer, "null"]
          minimum: 0
        currency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
        available:
          type: [boolean, "null"]
          description: Nulo cuando la consulta es corporativa y no señala sucursal.
        sellable:
          type: [boolean, "null"]
          description: Nulo cuando la consulta es corporativa y no señala sucursal.
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
    CatalogItemPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CatalogItem"
        page:
          $ref: "#/components/schemas/PageMeta"
    SalesCurrencyTotals:
      type: object
      additionalProperties: false
      required:
        - currency
        - gross_cents
        - net_cents
        - discount_cents
        - courtesy_cents
        - tax_cents
        - unknown_discount_operation_count
        - unknown_courtesy_operation_count
        - unknown_tax_operation_count
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        gross_cents:
          type: integer
          minimum: 0
        net_cents:
          type: integer
          minimum: 0
        discount_cents:
          type: integer
          minimum: 0
        courtesy_cents:
          type: integer
          minimum: 0
        tax_cents:
          type: integer
          minimum: 0
        unknown_discount_operation_count:
          type: integer
          minimum: 0
        unknown_courtesy_operation_count:
          type: integer
          minimum: 0
        unknown_tax_operation_count:
          type: integer
          minimum: 0
    SalesServiceSummary:
      type: object
      additionalProperties: false
      required: [service_type, currency, order_count, gross_cents, net_cents]
      properties:
        service_type:
          type: string
          enum: [dine-in, takeout, delivery]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        order_count:
          type: integer
          minimum: 0
        gross_cents:
          type: integer
          minimum: 0
        net_cents:
          type: integer
          minimum: 0
    SalesTopProduct:
      type: object
      additionalProperties: false
      required: [product_id, product_name, currency, quantity, gross_cents]
      properties:
        product_id:
          $ref: "#/components/schemas/Uuid"
        product_name:
          type: string
          minLength: 1
          maxLength: 160
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        quantity:
          type: integer
          minimum: 1
        gross_cents:
          type: integer
          minimum: 0
    SalesCorrectionSummary:
      type: object
      additionalProperties: false
      required: [currency, correction_count, net_delta_cents]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        correction_count:
          type: integer
          minimum: 0
        net_delta_cents:
          type: integer
    SalesDataQuality:
      type: object
      additionalProperties: false
      required: [incomplete_operation_count]
      properties:
        incomplete_operation_count:
          type: integer
          minimum: 0
    SalesSummary:
      type: object
      additionalProperties: false
      required:
        - branch_id
        - from_utc
        - to_utc
        - order_count
        - totals_by_currency
        - services
        - top_products
        - corrections_by_currency
        - data_quality
      properties:
        branch_id:
          $ref: "#/components/schemas/Uuid"
        from_utc:
          type: string
          format: date-time
        to_utc:
          type: string
          format: date-time
        order_count:
          type: integer
          minimum: 0
        totals_by_currency:
          type: array
          items:
            $ref: "#/components/schemas/SalesCurrencyTotals"
        services:
          type: array
          items:
            $ref: "#/components/schemas/SalesServiceSummary"
        top_products:
          type: array
          description: Hasta top_limit productos por cada moneda presente en el periodo.
          items:
            $ref: "#/components/schemas/SalesTopProduct"
        corrections_by_currency:
          type: array
          items:
            $ref: "#/components/schemas/SalesCorrectionSummary"
        data_quality:
          $ref: "#/components/schemas/SalesDataQuality"
    InventoryItem:
      type: object
      additionalProperties: false
      required: [id, sku, name, unit_id, active, version]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 160
        unit_id:
          $ref: "#/components/schemas/Uuid"
        active:
          type: boolean
        version:
          type: integer
