        - yield_quantity
        - yield_unit_id
        - components
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        target_id:
          $ref: "#/components/schemas/Uuid"
        expected_active_recipe_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
